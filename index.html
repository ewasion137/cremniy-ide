<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cremniy IDE - Low-level toolkit</title>
    <!-- Подключаем наш отдельный CSS файл -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Навигация -->
    <header class="navbar fade-in">
        <div class="logo-container">
            <img src="resources/cremniyicon.png" alt="Cremniy Logo" class="logo">
            <span class="logo-text">Cremniy</span>
        </div>
        <nav class="nav-links">
            <a href="https://github.com/ewasion137/cremniy-ide" target="_blank">GitHub</a>
            <a href="about.html">About</a> <!-- Вот тут поменяй -->
        </nav>
    </header>

    <!-- Главный экран -->
    <main class="hero fade-in-up delay-1">
        <h1 class="hero-title">All tools in a <span class="highlight">single window</span>.</h1>
        <p class="hero-subtitle">
            HEX-editor, disassembler, and code editor strictly combined. <br>
            Built for low-level development.
        </p>
        
        <div class="hero-buttons">
            <a href="https://github.com/munirov/cremniy/releases" class="btn btn-primary">Download v0.2.0</a>
            <a href="https://github.com/munirov/cremniy" target="_blank" class="btn btn-secondary">Source Code</a>
        </div>
    </main>

    <!-- Демонстрация (Гифка) -->
    <section class="demo-section fade-in-up delay-2">
        <div class="window-frame">
            <div class="window-header">
                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>
            </div>
            <!-- Твоя гифка -->
            <img src="resources/progview.gif" alt="Cremniy IDE in action" class="demo-gif">
        </div>
    </section>

    <!-- Подвал -->
    <footer class="footer fade-in delay-3">
        <p>Cremniy IDE © 2026. Open-source low-level toolkit.</p>
    </footer>

</body>
</html>
