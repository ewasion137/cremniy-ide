<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cremniy IDE - Low-level toolkit</title>
    <!-- Подключаем Tailwind (магия без установки node_modules) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        // Цвета в стиле GitHub Dark / VS Code
                        gray: { 900: '#0d1117', 800: '#161b22', 700: '#21262d' } 
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-900 text-gray-300 font-sans antialiased selection:bg-blue-500 selection:text-white">

    <!-- Главный блок (Hero) -->
    <div class="max-w-5xl mx-auto px-6 py-20 text-center mt-10">
        <h1 class="text-5xl md:text-6xl font-extrabold tracking-tight mb-6 text-white">
            Cremniy <span class="text-blue-500">IDE</span>
        </h1>
        <p class="text-xl md:text-2xl text-gray-400 mb-10 max-w-3xl mx-auto">
            HEX-editor, disassembler, and code editor strictly in a single window. 
            Built for low-level development.
        </p>
        
        <!-- Кнопки -->
        <div class="flex justify-center gap-4">
            <a href="https://github.com/munirov/cremniy/releases" class="bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 px-8 rounded-lg transition duration-200">
                Download v0.2.0
            </a>
            <a href="https://github.com/munirov/cremniy" target="_blank" class="bg-gray-800 hover:bg-gray-700 border border-gray-700 text-white font-bold py-3 px-8 rounded-lg transition duration-200">
                GitHub
            </a>
        </div>

        <!-- Место под крутой скриншот -->
        <div class="mt-16 bg-gray-800 border border-gray-700 rounded-xl shadow-2xl h-96 flex items-center justify-center overflow-hidden">
            <p class="text-gray-500">[ Сюда закинем сочный скриншот интерфейса проги ]</p>
            <!-- Когда будет картинка, раскомментируй это:
            <img src="screenshot.png" alt="Cremniy IDE Interface" class="w-full h-full object-cover">
            -->
        </div>
    </div>

</body>
</html>
